apiVersion: v1
kind: Pod
metadata:
  name: vulnerable-pod
  namespace: default
spec:
  hostPID: true
  hostNetwork: true
  containers:
    - name: app-container
      image: nginx:latest
      securityContext:
        privileged: true
        runAsUser: 0
        runAsNonRoot: false
        readOnlyRootFilesystem: false
        capabilities:
          add:
            - SYS_ADMIN
            - NET_ADMIN

openapi: 3.0.3
info:
  title: Vulnerable Bookstore API
  version: 1.0.0
servers:
  - url: http://api.vulnerable-bookstore.example.com
paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service health status
  /api/v1/books:
    get:
      summary: List all books
      responses:
        '200':
          description: Array of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
    post:
      summary: Create book with mass assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                price:
                  type: number
                role:
                  type: string
      responses:
        '201':
          description: Created book
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  secret_key:
                    type: string
  /api/v1/books/{bookId}:
    get:
      summary: Get book by ID
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book details
  /admin/database/backup:
    post:
      summary: Unprotected database backup
      responses:
        '200':
          description: Backup initiated
components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string

[workspace]
members = [
    "crates/cyberguard-core",
    "crates/cyberguard-proc",
    "crates/cyberguard-cli",
    "crates/cyberguard-sast",
    "crates/cyberguard-sca",
    "crates/cyberguard-secret",
    "crates/cyberguard-container",
    "crates/cyberguard-net",
    "crates/cyberguard-dast",
    "crates/cyberguard-api",
    "crates/cyberguard-cloud",
    "crates/cyberguard-iac",
    "crates/cyberguard-pipeline",
    "crates/cyberguard-mobile",
    "crates/cyberguard-threat",
    "crates/cyberguard-mcp",
]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
authors = ["Shaik Yusuf John <yusufjohn252007@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/yusufjohn-shaik/AEGIX"
homepage = "https://github.com/yusufjohn-shaik/AEGIX"
documentation = "https://github.com/yusufjohn-shaik/AEGIX"
readme = "README.md"
keywords = ["security", "vulnerability", "scanner", "ast", "remediation"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# CLI & Terminal
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Configuration
figment = { version = "0.10", features = ["yaml", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Process & Signals
nix = { version = "0.29", features = ["process", "signal"] }

# Time & Duration
chrono = { version = "0.4", features = ["serde"] }

# Cryptographic Hashing
sha2 = "0.10"

# Semver evaluation
semver = { version = "1.0", features = ["serde"] }

# Internal workspace crates
cyberguard-core = { path = "crates/cyberguard-core" }
cyberguard-proc = { path = "crates/cyberguard-proc" }
cyberguard-sast = { path = "crates/cyberguard-sast" }
cyberguard-sca = { path = "crates/cyberguard-sca" }
cyberguard-secret = { path = "crates/cyberguard-secret" }
cyberguard-container = { path = "crates/cyberguard-container" }
cyberguard-net = { path = "crates/cyberguard-net" }
cyberguard-dast = { path = "crates/cyberguard-dast" }
cyberguard-api = { path = "crates/cyberguard-api" }
cyberguard-cloud = { path = "crates/cyberguard-cloud" }
cyberguard-iac = { path = "crates/cyberguard-iac" }
cyberguard-pipeline = { path = "crates/cyberguard-pipeline" }
cyberguard-mobile = { path = "crates/cyberguard-mobile" }
cyberguard-threat = { path = "crates/cyberguard-threat" }
cyberguard-mcp = { path = "crates/cyberguard-mcp" }
base64 = "0.22"
plist = "1.10"
quick-xml = "0.42"

# SAST Engine dependencies
regex = "1.11"
walkdir = "2.5"
async-trait = "0.1"
flate2 = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "deflate"] }
url = { version = "2.5", features = ["serde"] }
